<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convert2Any — convert, edit and secure files in your browser</title>
    <!--
      No description meta here on purpose: every route injects its own at
      build time (see headElements in src/seo.ts). A static one would be
      duplicated on all 27 prerendered pages.
    -->
    <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c09" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
